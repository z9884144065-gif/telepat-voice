<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диагностика Telepat</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #ff4d4d; }
        textarea { width: 100%; height: 150px; background: #222; color: #fff; border: 1px solid #444; padding: 10px; font-size: 16px; margin-bottom: 10px; }
        button { padding: 15px; font-size: 16px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; width: 100%; }
        .btn-live { background: #3498db; }
        .btn-whisper { background: #e67e22; }
        #debug-log { background: #000; color: #00ff00; padding: 15px; border-radius: 8px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 13px; border: 1px solid #333; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>🛠 Диагностика Telepat</h1>
    
    <textarea id="output" placeholder="Здесь появится текст..."></textarea>
    
    <button class="btn-live" id="btnLive">1. Тест онлайн-режима (Web Speech)</button>
    <button class="btn-whisper" id="btnWhisper">2. Тест офлайн-режима (Whisper)</button>

    <h3>Лог событий (сюда пишутся ошибки):</h3>
    <div id="debug-log">Ожидание действий...</div>

    <script type="module">
        const logDiv = document.getElementById('debug-log');
        const output = document.getElementById('output');

        // Функция для вывода сообщений в лог
        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const color = isError ? 'red' : '#00ff00';
            logDiv.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        // Проверка поддержки браузера
        log("Браузер: " + navigator.userAgent);
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            log("КРИТИЧЕСКАЯ ОШИБКА: Браузер не поддерживает доступ к микрофону (getUserMedia).", true);
        } else {
            log("Микрофон (getUserMedia) поддерживается.");
        }

        // ==========================================
        // ТЕСТ 1: Web Speech API (Онлайн)
        // ==========================================
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            log("Web Speech API НЕ ПОДДЕРЖИВАЕТСЯ этим браузером.", true);
        } else {
            log("Web Speech API поддерживается.");
        }

        document.getElementById('btnLive').addEventListener('click', () => {
            log("--- ЗАПУСК ТЕСТА 1 (Web Speech) ---");
            if (!SpeechRecognition) {
                log("Ошибка: Web Speech API недоступен.", true);
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';

            recognition.onstart = () => log("Микрофон включен. Говорите!");
            recognition.onspeechend = () => log("Речь закончилась.");
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                log("РАСПОЗНАНО: " + text);
                output.value += text + " ";
            };
            recognition.onerror = (event) => {
                log("ОШИБКА WEB SPEECH: " + event.error, true);
                if (event.error === 'network') {
                    log("Браузер не может связаться с серверами Google. Скорее всего, нужен VPN.", true);
                }
            };
            recognition.onend = () => log("Микрофон выключен.");

            try {
                recognition.start();
            } catch (e) {
                log("Ошибка запуска: " + e.message, true);
            }
        });

        // ==========================================
        // ТЕСТ 2: Whisper (Офлайн)
        // ==========================================
        let transcriber = null;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        document.getElementById('btnWhisper').addEventListener('click', async () => {
            log("--- ЗАПУСК ТЕСТА 2 (Whisper) ---");
            
            if (!isRecording) {
                // Начинаем запись
                try {
                    log("Запрос доступа к микрофону...");
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    log("Доступ получен. Начинаем запись...");
                    
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    
                    mediaRecorder.onstop = async () => {
                        log("Запись остановлена. Обработка...");
                        document.getElementById('btnWhisper').textContent = "⏳ Думаю...";
                        
                        try {
                            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                            const arrayBuffer = await audioBlob.arrayBuffer();
                            const audioContext = new AudioContext({ sampleRate: 16000 });
                            const decodedAudio = await audioContext.decodeAudioData(arrayBuffer);
                            const audioData = decodedAudio.getChannelData(0);
                            
                            log("Аудио декодировано. Загрузка нейросети (если не загружена)...");
                            
                            // Подгружаем модель динамически
                            if (!transcriber) {
                                const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
                                transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', {
                                    quantized: true,
                                    progress_callback: (data) => {
                                        if (data.status === 'progress') {
                                            log(`Загрузка Whisper: ${Math.round(data.progress)}%`);
                                        }
                                    }
                                });
                                log("Нейросеть загружена!");
                            }
                            
                            log("Распознавание речи...");
                            const result = await transcriber(audioData, { language: 'russian', task: 'transcribe' });
                            log("РЕЗУЛЬТАТ: " + result.text);
                            output.value += result.text + " ";
                            
                        } catch (err) {
                            log("ОШИБКА ОБРАБОТКИ: " + err.message, true);
                            console.error(err);
                        }
                        
                        document.getElementById('btnWhisper').textContent = "2. Тест офлайн-режима (Whisper)";
                        isRecording = false;
                    };
                    
                    mediaRecorder.start();
                    isRecording = true;
                    document.getElementById('btnWhisper').textContent = "⏹ Остановить и распознать";
                    
                } catch (err) {
                    log("ОШИБКА МИКРОФОНА: " + err.message, true);
                }
            } else {
                // Останавливаем запись
                mediaRecorder.stop();
            }
        });

    </script>
</body>
</html>
